name: Validate game
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - name: Return generated dependency lock
        run: |
          node --input-type=module -e 'import {readFileSync} from "node:fs"; const value=readFileSync("pnpm-lock.yaml","utf8"); for(let i=0;i<value.length;i+=4000) console.log("LOCKCHUNK "+i+" "+JSON.stringify(value.slice(i,i+4000)));'
      - run: pnpm install --frozen-lockfile
      - name: Inspect vulnerable image parser entrypoints
        run: |
          node --input-type=module -e 'import {readFileSync,readdirSync} from "node:fs"; import {createRequire} from "node:module"; import {dirname,join} from "node:path"; const req=createRequire(import.meta.resolve("vinext")); const entry=req.resolve("image-size"), root=dirname(entry); console.log("IMAGEENTRY "+entry); console.log("IMAGELIST "+JSON.stringify(readdirSync(root,{recursive:true}))); for(const file of readdirSync(root,{recursive:true}).filter(f=>/index\.(mjs|cjs|js)$/.test(f))) { const path=join(root,file), value=readFileSync(path,"utf8"); for(let i=0;i<value.length;i+=4000) console.log("IMAGECHUNK "+JSON.stringify({path:file,offset:i,text:value.slice(i,i+4000)})); }'

      - run: pnpm db:generate
      - run: git diff --exit-code -- drizzle/
      - run: node scripts/check-security.mjs
      - run: node scripts/test-ai-chat.mjs
      - run: node scripts/test-budget.mjs
      - run: node scripts/test-training.mjs
      - run: node scripts/test-progress.mjs
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
      - run: pnpm audit --audit-level low
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: whatfraud-build
          path: dist/
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error
