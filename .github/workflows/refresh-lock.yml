name: Resolve security lockfile
on:
  pull_request:
    paths: ['package.json', 'pnpm-workspace.yaml', '.github/workflows/refresh-lock.yml']
permissions:
  contents: read
jobs:
  resolve:
    if: github.head_ref == 'codex/decision-moment-ai'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Return generated lockfile only
        run: |
          node --input-type=module -e 'import {readFileSync} from "node:fs"; const s=readFileSync("pnpm-lock.yaml","utf8");for(let i=0;i<s.length;i+=2000)console.log("LOCKCHUNK "+JSON.stringify(s.slice(i,i+2000)));'
